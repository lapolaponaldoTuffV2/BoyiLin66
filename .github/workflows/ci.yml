name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install stable Rust with checks
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - run: npm ci --prefix frontend
      - name: Install Chromium and browser system dependencies
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: cargo test -p boyi-protocol --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo fmt --all --check
      - run: npm run build
      - run: npm run test:ui
